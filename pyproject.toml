[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmsend"
version = "0.1.0"
description = "Gmail from your terminal. Attachments included."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alim Polat", email = "alimpolat@gmail.com" }]
keywords = ["gmail", "email", "cli", "attachments", "google", "api", "oauth2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff"]

[project.scripts]
gmsend = "gmsend.cli:app"

[project.urls]
Homepage = "https://github.com/alimpolat/gmsend"
Repository = "https://github.com/alimpolat/gmsend"
Issues = "https://github.com/alimpolat/gmsend/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gmsend"]

[tool.ruff]
target-version = "py310"
line-length = 100
